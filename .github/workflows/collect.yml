name: Update memories
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run collect
      - name: Commit memories
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/memories.json
          git diff --cached --quiet || git commit -m 'data: update memories'
          git push
